<style>
/* ══ RESET & VARIABLES ══════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0e0f;--bg2:#161618;--bg3:#1e1e21;--border:#2a2a2e;
  --orange:#f97316;--orange2:#ea580c;--text:#f0ede8;--muted:#7a7878;
  --success:#22c55e;--warn:#eab308;--danger:#ef4444;--card:#18181b;
  --wa:#25D366;--wa2:#128C7E;--blue:#3b82f6;
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
input,select,textarea,button{font-family:'DM Sans',sans-serif;}

/* ══ TOAST ══════════════════════════════════════════ */
#toastBox{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;
  gap:.45rem;pointer-events:none;max-width:310px;width:calc(100vw - 2rem);}
.toast{pointer-events:all;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:.68rem .95rem;font-size:.81rem;display:flex;align-items:center;justify-content:space-between;
  gap:.6rem;transform:translateX(110%);transition:transform .26s ease;
  box-shadow:0 4px 20px rgba(0,0,0,.5);}
.toast.show{transform:translateX(0);}
.toast-success{border-left:3px solid var(--success);}
.toast-error{border-left:3px solid var(--danger);}
.toast-warn{border-left:3px solid var(--warn);}
.toast-msg{flex:1;line-height:1.4;}
.toast-close{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:1.05rem;padding:0 .15rem;line-height:1;flex-shrink:0;}

/* ══ PAGES ══════════════════════════════════════════ */
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

/* ══ LANDING ════════════════════════════════════════ */
#pgLanding{align-items:center;justify-content:center;padding:2rem;
  position:relative;overflow:hidden;text-align:center;}
#pgLanding::before{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:80%;
  background:radial-gradient(ellipse,rgba(249,115,22,.09) 0%,transparent 70%);pointer-events:none;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,9vw,4.8rem);
  letter-spacing:3px;line-height:1;position:relative;z-index:10;}
.logo span{color:var(--orange);}
.land-sub{color:var(--muted);margin:.38rem 0 1.8rem;font-size:.78rem;
  letter-spacing:2px;text-transform:uppercase;position:relative;z-index:10;}
.land-cards{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.4rem;position:relative;z-index:10;}
.lcard{background:var(--bg3);border:1px solid var(--border);border-radius:16px;
  padding:1.8rem 1.6rem;min-width:172px;cursor:pointer;transition:all .2s;text-align:center;}
.lcard:hover,.lcard:active{border-color:var(--orange);transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(249,115,22,.18);}
.lcard-ico{font-size:1.95rem;margin-bottom:.55rem;}
.lcard h3{font-family:'Bebas Neue',sans-serif;font-size:1.42rem;letter-spacing:1px;margin-bottom:.2rem;}
.lcard p{color:var(--muted);font-size:.77rem;}
.maps-link{color:var(--muted);font-size:.75rem;text-decoration:none;
  display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.72rem;position:relative;z-index:10;}
.maps-link:hover{color:var(--orange);}

/* ══ TOPBAR ═════════════════════════════════════════ */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.8rem 1.3rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;flex-shrink:0;}
.tbrand{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;}
.tbrand span{color:var(--orange);}
.topbar-r{display:flex;align-items:center;gap:.68rem;}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);
  padding:.3rem .78rem;border-radius:8px;cursor:pointer;font-size:.76rem;
  transition:all .15s;touch-action:manipulation;}
.back-btn:hover{border-color:var(--orange);color:var(--text);}
.client-name{color:var(--muted);font-size:.78rem;}

/* ══ CONTENT ════════════════════════════════════════ */
.content{padding:1.2rem;max-width:1050px;margin:0 auto;width:100%;flex:1;}

/* ══ CARD ════════════════════════════════════════════ */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.05rem;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;
  margin-bottom:.8rem;color:var(--orange);}

/* ══ STATS ═══════════════════════════════════════════ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:.82rem;margin-bottom:1.1rem;}
.stat{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:.92rem;}
.stat-num{font-family:'Bebas Neue',sans-serif;font-size:2.2rem;color:var(--orange);line-height:1;}
.stat-lbl{color:var(--muted);font-size:.67rem;text-transform:uppercase;
  letter-spacing:1px;margin-top:.12rem;}

/* ══ TABLE ═══════════════════════════════════════════ */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;font-size:.8rem;}
th{text-align:left;padding:.46rem .66rem;color:var(--muted);font-size:.65rem;
  text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);font-weight:500;}
td{padding:.62rem .66rem;border-bottom:1px solid #1e1e21;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--bg3);}

/* ══ BADGE ═══════════════════════════════════════════ */
.badge{display:inline-block;padding:.13rem .46rem;border-radius:20px;font-size:.65rem;font-weight:600;}
.b-green{background:rgba(34,197,94,.15);color:var(--success);}
.b-yellow{background:rgba(234,179,8,.15);color:var(--warn);}
.b-orange{background:rgba(249,115,22,.15);color:var(--orange);}
.b-red{background:rgba(239,68,68,.15);color:var(--danger);}
.b-blue{background:rgba(59,130,246,.15);color:var(--blue);}

/* ══ BUTTONS ════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.26rem;
  padding:.46rem .92rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;
  border:none;transition:all .15s;-webkit-appearance:none;touch-action:manipulation;}
.btn-p{background:var(--orange);color:#fff;}
.btn-p:hover,.btn-p:active{background:var(--orange2);}
.btn-g{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-g:hover,.btn-g:active{border-color:var(--orange);color:var(--orange);}
.btn-d{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);}
.btn-s{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3);}
.btn-wa{background:var(--wa);color:#fff;border:none;}
.btn-wa:hover,.btn-wa:active{background:var(--wa2);}
.btn-wa-big{background:var(--wa);color:#fff;border:none;border-radius:10px;padding:.8rem 1.5rem;
  font-size:.98rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;
  gap:.46rem;transition:all .15s;touch-action:manipulation;width:100%;justify-content:center;}
.btn-wa-big:active{background:var(--wa2);}
.btn-sm{padding:.22rem .52rem;font-size:.7rem;}
.btn-full{width:100%;margin-top:.26rem;}
.btn:disabled{opacity:.38;cursor:not-allowed;pointer-events:none;}

/* ══ FORMS ═══════════════════════════════════════════ */
.fg{margin-bottom:.8rem;}
.fl{display:block;font-size:.68rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:.26rem;}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:.52rem .76rem;border-radius:8px;font-size:.88rem;transition:border .15s;
  outline:none;-webkit-appearance:none;}
.fi:focus{border-color:var(--orange);}
textarea.fi{resize:vertical;min-height:82px;line-height:1.5;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
@media(max-width:480px){.fr{grid-template-columns:1fr;}}
select.fi option{background:var(--bg2);}
.search-bar{position:relative;margin-bottom:.8rem;}
.search-bar input{width:100%;background:var(--bg3);border:1px solid var(--border);
  color:var(--text);padding:.5rem .8rem .5rem 2.1rem;border-radius:8px;font-size:.82rem;outline:none;}
.search-bar input:focus{border-color:var(--orange);}
.search-bar::before{content:'🔍';position:absolute;left:.6rem;top:50%;
  transform:translateY(-50%);font-size:.82rem;pointer-events:none;}

/* ══ SERVICE GRID ════════════════════════════════════ */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(136px,1fr));gap:.58rem;}
.sc{border:2px solid var(--border);border-radius:10px;padding:.8rem;cursor:pointer;
  transition:all .15s;text-align:center;touch-action:manipulation;}
.sc:hover,.sc:active,.sc.sel{border-color:var(--orange);background:rgba(249,115,22,.07);}
.sc-name{font-weight:600;font-size:.8rem;margin-bottom:.13rem;}
.sc-price{color:var(--orange);font-size:.75rem;font-weight:700;}
.sc-meta{color:var(--muted);font-size:.67rem;}

/* ══ TIME GRID ═══════════════════════════════════════ */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:.36rem;}
.tb{border:1px solid var(--border);background:var(--bg3);color:var(--text);padding:.38rem;
  border-radius:8px;cursor:pointer;font-size:.77rem;transition:all .15s;text-align:center;
  touch-action:manipulation;}
.tb:hover,.tb:active,.tb.sel{border-color:var(--orange);color:var(--orange);
  background:rgba(249,115,22,.07);}
.tb.taken{opacity:.22;cursor:not-allowed;pointer-events:none;text-decoration:line-through;}

/* ══ ALERT ════════════════════════════════════════════ */
.alert{padding:.74rem .9rem;border-radius:8px;margin-bottom:.8rem;font-size:.8rem;line-height:1.5;}
.ao{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);color:var(--orange);}
.ag{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--success);}
.ar{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);}
.ab{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--blue);}

/* ══ SECTION HEADER ═════════════════════════════════ */
.sh{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.9rem;flex-wrap:wrap;gap:.46rem;}
.st{font-family:'Bebas Neue',sans-serif;font-size:1.38rem;letter-spacing:1px;}

/* ══ VEHICLE INFO BOX ════════════════════════════════ */
.vinfo{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:.5rem .75rem;font-size:.82rem;margin-bottom:.76rem;}

/* ══ VEHICLE TYPE BUTTONS ════════════════════════════ */
.vtype-btns{display:flex;gap:.5rem;margin-top:.26rem;}
.vtype-btn{flex:1;padding:.5rem;border:2px solid var(--border);border-radius:8px;
  background:transparent;color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;
  transition:all .15s;text-align:center;touch-action:manipulation;}
.vtype-btn.sel{border-color:var(--orange);background:rgba(249,115,22,.08);color:var(--orange);}

/* ══ SUMMARY BOX ═════════════════════════════════════ */
.sum-box{background:rgba(249,115,22,.05);border:1px solid rgba(249,115,22,.3);
  border-radius:12px;padding:.92rem;margin-bottom:.85rem;}

/* ══ NEXT SERVICE ════════════════════════════════════ */
.next-svc{background:linear-gradient(135deg,rgba(249,115,22,.12),rgba(249,115,22,.04));
  border:1px solid rgba(249,115,22,.35);border-radius:14px;padding:1rem 1.1rem;
  margin-bottom:1.3rem;}
.next-svc-title{font-family:'Bebas Neue',sans-serif;font-size:1.02rem;letter-spacing:1px;
  color:var(--orange);margin-bottom:.36rem;}

/* ══ SUCCESS BANNER ══════════════════════════════════ */
.success-banner{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.38);
  border-radius:14px;padding:1.28rem;margin-bottom:.88rem;text-align:center;}
.sb-icon{font-size:2.2rem;margin-bottom:.36rem;}
.sb-title{font-family:'Bebas Neue',sans-serif;font-size:1.45rem;letter-spacing:1px;
  color:var(--success);margin-bottom:.26rem;}
.sb-sub{color:var(--muted);font-size:.8rem;margin-bottom:.88rem;line-height:1.55;}
.btn-wa-big-hint{color:var(--muted);font-size:.7rem;margin-top:.42rem;}

/* ══ APPT CARD ════════════════════════════════════════ */
.appt-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:.88rem;display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:.52rem;margin-bottom:.52rem;}

/* ══ LIBRETITO ════════════════════════════════════════ */
.libretito-card{background:var(--bg3);border:1px solid var(--border);border-radius:14px;
  padding:1.2rem 1.2rem 1rem;margin-bottom:1rem;overflow:hidden;}
.libretito-header{display:flex;align-items:flex-start;justify-content:space-between;
  flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem;padding-bottom:.8rem;border-bottom:1px solid var(--border);}
.libretito-service{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;
  color:var(--text);line-height:1.15;}
.libretito-date{color:var(--muted);font-size:.82rem;margin-top:.18rem;}
.libretito-pills{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.85rem;}
.libretito-pill{display:inline-flex;flex-direction:column;background:var(--bg2);
  border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;min-width:110px;flex:1;}
.libretito-pill-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:.18rem;}
.libretito-pill-value{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.2;}
.libretito-pill.pill-km .libretito-pill-value{color:var(--orange);}
.libretito-pill.pill-oil .libretito-pill-value{color:#60a5fa;}
.libretito-pill.pill-next .libretito-pill-value{color:var(--success);font-size:.95rem;}
.libretito-cl-title{font-size:.72rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:.5rem;font-weight:600;}
.libretito-cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.36rem;margin-bottom:.8rem;}
.libretito-cl-item{display:flex;align-items:center;gap:.38rem;font-size:.84rem;
  font-weight:600;padding:.36rem .58rem;border-radius:7px;}
.libretito-cl-done{background:rgba(34,197,94,.1);color:var(--success);}
.libretito-cl-skip{background:rgba(239,68,68,.08);color:var(--danger);}
.libretito-cl-ico{font-size:.9rem;flex-shrink:0;}
.libretito-obs{background:var(--bg2);border:1px solid var(--border);border-radius:9px;
  padding:.75rem .9rem;font-size:.9rem;color:var(--text);line-height:1.65;margin-top:.1rem;}
.libretito-obs-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:.32rem;font-weight:600;}

/* ══ STEP INDICATOR ══════════════════════════════════ */
.step-title{display:flex;align-items:center;font-weight:600;margin-bottom:.8rem;font-size:.88rem;}
.sn{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;
  border-radius:50%;background:var(--orange);color:#fff;font-family:'Bebas Neue',sans-serif;
  font-size:.88rem;margin-right:.38rem;flex-shrink:0;}

/* ══ EMPTY ═══════════════════════════════════════════ */
.empty{text-align:center;padding:2rem 1rem;color:var(--muted);}

/* ══ CLOSED MSG ═════════════════════════════════════ */
.closed-msg{text-align:center;padding:1.4rem;color:var(--danger);font-size:.88rem;
  background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;}

/* ══ DIVIDER ═════════════════════════════════════════ */
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0;}
</style>

/* ══ TOAST ══════════════════════════════════════════ */
function toast(msg,type="success",ms=3400){
  const box=document.getElementById("toastBox");
  const el=document.createElement("div");
  el.className=`toast toast-${type}`;
  el.innerHTML=`<span class="toast-msg">${msg}</span>
    <button class="toast-close" onclick="this.parentElement.remove()">×</button>`;
  box.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("show")));
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=>el.remove(),300); },ms);
}

/* ══ HELPERS ════════════════════════════════════════ */
const fmtD   = s=>{ if(!s)return""; const[y,m,d]=s.split("-"); return`${d}/${m}/${y}`; };
const uid    = ()=>Math.random().toString(36).substr(2,9);
const esc    = s=>String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/'/g,"&#39;");
const fmtNum = n=>parseInt(n||0).toLocaleString("es-AR");
function cleanWA(num){
  let c=(num||"").replace(/\D/g,"");
  if(c.startsWith("549")) return c;
  if(c.startsWith("54"))  return "5"+c;
  return "549"+c;
}
function validateWA(num){ const c=(num||"").replace(/\D/g,""); return c.length>=8&&c.length<=15; }
function bdg(s){
  const m={pendiente:["b-yellow","⏳ Pendiente"],confirmado:["b-orange","✅ Confirmado"],
           completado:["b-green","🔧 Completado"],cancelado:["b-red","❌ Cancelado"]};
  const[c,l]=m[s]||["b-yellow",s];
  return`<span class="badge ${c}">${l}</span>`;
}
function toggleOther(sel,oid){
  const el=document.getElementById(oid);
  if(el) el.style.display=sel.value==="Otro"?"block":"none";

/* ══ SERVICE INTERVALS ══════════════════════════════ */
function calcNextService(km,dateStr,vtype){
  const iv=SVC_INTERVAL[vtype]||SVC_INTERVAL.auto;
  const nextKm=(parseInt(km)||0)+iv.km;
  const dt=new Date((dateStr||todayISO)+"T12:00:00");
  dt.setMonth(dt.getMonth()+iv.months);
  return{nextKm, nextDate:dt.toISOString().split("T")[0], iv};
}

/* ══ HOURS / DATE LOGIC ═════════════════════════════ */
function getHoursForDate(dateStr){
  const dow=new Date(dateStr+"T12:00:00").getDay();
  if(dow===0) return [];
  if(dow===6) return [...HRS_MORNING];
  return [...HRS_MORNING,...HRS_AFTERNOON];
}
function isDayClosed(dateStr){ return new Date(dateStr+"T12:00:00").getDay()===0; }

/* ══ SLOT / PIT LOGIC ═══════════════════════════════ */
function getPit(svcId){
  return(SERVICES.find(s=>s.id===svcId)?.type||"auto")==="camion"?"camion":"auto";
}
function getTaken(date,pit){
  const s=new Set();
  APPTS.filter(a=>a.date===date&&(a.pit||"auto")===pit)
       .forEach(a=>(a.blockedSlots||[a.time]).forEach(t=>s.add(t)));
  return s;
}
function getSlots(startTime,durMins,dateStr){
  const n=Math.max(1,Math.ceil((durMins||30)/30));
  const dayH=getHoursForDate(dateStr);
  const idx=dayH.indexOf(startTime);
  if(idx===-1||idx+n>dayH.length) return null;
  const slots=[];
  for(let i=0;i<n;i++){
    if(i>0){
      const[ph,pm]=dayH[idx+i-1].split(":").map(Number);
      const[ch,cm]=dayH[idx+i].split(":").map(Number);
      if((ch*60+cm)-(ph*60+pm)!==30) return null;
    }
    slots.push(dayH[idx+i]);
  }
  return slots;
}
function isAvail(time,durMins,takenSet,dateStr){
  const slots=getSlots(time,durMins,dateStr);
  return slots!==null&&!slots.some(s=>takenSet.has(s));
}

async function tryIdentify(){
  const pat=(document.getElementById("cPat")?.value||"").trim().toUpperCase().replace(/[\s-]/g,"");
  const err=document.getElementById("cErr");
  const showErr=m=>{err.textContent="⚠️ "+m;err.style.display="block";};
  if(!pat){showErr("Ingresá la patente de tu auto.");return;}
  const found=CLIENTS.find(c=>c.patent===pat);
  if(found){CLIENT=found;renderClientHome();return;}
  const nf=document.getElementById("newFields");
  if(nf.style.display==="none"){
    nf.style.display="block";
    document.getElementById("cEnterBtn").textContent="Registrarme y entrar →";
    showErr("No encontramos esa patente. Completá tus datos para registrarte.");return;
  }
  const name =document.getElementById("cName")?.value.trim()||"";
  const wa   =document.getElementById("cWa")?.value.trim()||"";
  const vtype=document.getElementById("cVtype")?.value||"auto";
  const brand=getBrandVal("cBrand","cBrandOther");
  const model=document.getElementById("cModel")?.value.trim()||"";
  const year =document.getElementById("cYear")?.value.trim()||"";
  const motor=document.getElementById("cMotor")?.value.trim()||"";
  if(!name||!wa||!brand||!model||!year||!motor){showErr("Completá todos los campos.");return;}
  if(!validateWA(wa)){showErr("WhatsApp inválido (solo números, sin espacios).");return;}
  if(CLIENTS.find(c=>c.patent===pat)){showErr("Ya existe un cliente con esa patente.");return;}
  const nc={id:uid(),name,whatsapp:wa,patent:pat,vehicleType:vtype,brand,model,year,motor};
  CLIENTS.push(nc);
  await fsPut("clients",CLIENTS);
  CLIENT=nc;renderClientHome();
  toast("¡Registro exitoso! Bienvenido 🎉","success");
}

}

function bkTime(h){BK.time=h;if(BK.step<3)BK.step=3;drawBooking();}
function bkDate(d){
  if(isDayClosed(d)){
    toast("Domingos cerrado. Avanzando al lunes.","warn");
    const nd=new Date(d+"T12:00:00");nd.setDate(nd.getDate()+1);
    BK.date=nd.toISOString().split("T")[0];
  } else {BK.date=d;}
  BK.time="";drawBooking();
}

async function confirmBk(){
  const sv=SERVICES.find(s=>s.id===BK.service);if(!sv)return;
  if(isDayClosed(BK.date)){toast("Cerrado ese día","error");return;}
  const dur=sv.duration||30;
  const pit=getPit(BK.service);
  const freshAppts=await fsGet("appointments",[]);
  APPTS=freshAppts;
  const taken=getTaken(BK.date,pit);
  if(!isAvail(BK.time,dur,taken,BK.date)){
    toast("Ese horario ya fue tomado. Elegí otro.","error");
    BK.time="";drawBooking();return;
  }
  const slots=getSlots(BK.time,dur,BK.date)||[BK.time];
  const appt={
    id:uid(),clientId:CLIENT.id,patent:CLIENT.patent,
    vehicleDesc:`${CLIENT.brand} ${CLIENT.model} ${CLIENT.year}`,
    motor:CLIENT.motor||"",date:BK.date,time:BK.time,
    service:BK.service,serviceName:sv.name,
    pit,blockedSlots:slots,status:"pendiente",km:BK.km,notes:""
  };
  APPTS.push(appt);
  await fsPut("appointments",APPTS);
  const waMsg=`¡Hola! Reservé un turno en Lubricentro Esquiú.\n\n`+
    `🔧 *Servicio:* ${sv.name}\n`+
    `📅 *Fecha:* ${fmtD(BK.date)} a las ${BK.time}\n`+
    `${CLIENT.vehicleType==="camion"?"🚛":"🚗"} *Vehículo:* ${CLIENT.brand} ${CLIENT.model} ${CLIENT.year}\n`+
    `🔑 *Patente:* ${CLIENT.patent}\n`+
    `⚙️ *Motor:* ${CLIENT.motor||"—"}\n`+
    `🔩 *Fosa:* ${pit==="camion"?"Camiones":"Autos"}`;
  const waURL=`https://wa.me/${PHONE_LUBRI}?text=${encodeURIComponent(waMsg)}`;
  document.getElementById("clientArea").innerHTML=`
    <div style="max-width:480px;padding-top:1.5rem">
      <div class="success-banner">
        <div class="sb-icon">🎉</div>
        <div class="sb-title">¡TURNO GUARDADO!</div>
        <div class="sb-sub">
          <strong>${esc(sv.name)}</strong><br/>
          📅 ${fmtD(BK.date)} a las ${BK.time}<br/>
          ${CLIENT.vehicleType==="camion"?"🚛":"🚗"} ${esc(CLIENT.brand)} ${esc(CLIENT.model)} — ${CLIENT.patent}
        </div>
        <button class="btn-wa-big" onclick="window.open('${waURL}','_blank')">
          📲 CONFIRMAR POR WHATSAPP</button>
        <div class="btn-wa-big-hint">Tocá para notificar al lubricentro. Funciona en iOS y Android.</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:.45rem;margin-top:.15rem">
        <button class="btn btn-g btn-full" onclick="renderMyAppts()">📋 Ver mis turnos</button>
        <button class="btn btn-g btn-full" onclick="renderClientHome()">← Inicio</button>
      </div>
    </div>`;
}

/* ══ INIT ════════════════════════════════════════════ */
(async()=>{
  try{
    [CLIENTS,APPTS,SERVICES]=await Promise.all([
      fsGet("clients",    []),
      fsGet("appointments",[]),
      fsGet("services",   DEFAULT_SVC),
    ]);
    if(!SERVICES.length){SERVICES=DEFAULT_SVC;await fsPut("services",SERVICES);}
  }catch(e){
    console.error("Init:",e);
    SERVICES=DEFAULT_SVC;
    toast("Error al conectar con Firebase","error",5000);
  }
})();
</script>
