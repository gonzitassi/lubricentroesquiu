<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<meta name="theme-color" content="#0e0e0f"/>
<title>Lubricentro Esquiú — Turnos Online</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* ══ RESET & VARIABLES ══════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0e0e0f;--bg2:#161618;--bg3:#1e1e21;--border:#2a2a2e;
  --orange:#f97316;--orange2:#ea580c;--text:#f0ede8;--muted:#7a7878;
  --success:#22c55e;--warn:#eab308;--danger:#ef4444;--card:#18181b;
  --wa:#25D366;--wa2:#128C7E;--blue:#3b82f6;
}
html,body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;
  min-height:100vh;-webkit-tap-highlight-color:transparent;overflow-x:hidden;}
input,select,textarea,button{font-family:'DM Sans',sans-serif;}

/* ══ TOAST ══════════════════════════════════════════ */
#toastBox{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;
  gap:.45rem;pointer-events:none;max-width:310px;width:calc(100vw - 2rem);}
.toast{pointer-events:all;background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:.68rem .95rem;font-size:.81rem;display:flex;align-items:center;justify-content:space-between;
  gap:.6rem;transform:translateX(110%);transition:transform .26s ease;
  box-shadow:0 4px 20px rgba(0,0,0,.5);}
.toast.show{transform:translateX(0);}
.toast-success{border-left:3px solid var(--success);}
.toast-error  {border-left:3px solid var(--danger);}
.toast-warn   {border-left:3px solid var(--warn);}
.toast-msg{flex:1;line-height:1.4;}
.toast-close{background:none;border:none;color:var(--muted);cursor:pointer;
  font-size:1.05rem;padding:0 .15rem;line-height:1;flex-shrink:0;}

/* ══ PAGES ══════════════════════════════════════════ */
.page{display:none;min-height:100vh;flex-direction:column;}
.page.active{display:flex;}

/* ══ LANDING ════════════════════════════════════════ */
#pgLanding{align-items:center;justify-content:center;padding:2rem;
  position:relative;overflow:hidden;text-align:center;}
#pgLanding::before{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:80%;
  background:radial-gradient(ellipse,rgba(249,115,22,.09) 0%,transparent 70%);pointer-events:none;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(2rem,9vw,4.8rem);
  letter-spacing:3px;line-height:1;}
.logo span{color:var(--orange);}
.land-sub{color:var(--muted);margin:.38rem 0 1.8rem;font-size:.78rem;
  letter-spacing:2px;text-transform:uppercase;}
.land-cards{display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:center;margin-bottom:1.4rem;}
.lcard{background:var(--bg3);border:1px solid var(--border);border-radius:16px;
  padding:1.8rem 1.6rem;min-width:172px;cursor:pointer;transition:all .2s;text-align:center;}
.lcard:hover,.lcard:active{border-color:var(--orange);transform:translateY(-3px);
  box-shadow:0 8px 32px rgba(249,115,22,.18);}
.lcard-ico{font-size:1.95rem;margin-bottom:.55rem;}
.lcard h3{font-family:'Bebas Neue',sans-serif;font-size:1.42rem;letter-spacing:1px;margin-bottom:.2rem;}
.lcard p{color:var(--muted);font-size:.77rem;}
.maps-link{color:var(--muted);font-size:.75rem;text-decoration:none;
  display:inline-flex;align-items:center;gap:.3rem;margin-bottom:.72rem;}
.maps-link:hover{color:var(--orange);}

/* ══ TOPBAR ══════════════════════════════════════════ */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:.8rem 1.3rem;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;flex-shrink:0;}
.tbrand{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;}
.tbrand span{color:var(--orange);}
.topbar-r{display:flex;align-items:center;gap:.68rem;}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);
  padding:.3rem .78rem;border-radius:8px;cursor:pointer;font-size:.76rem;
  transition:all .15s;touch-action:manipulation;}
.back-btn:hover{border-color:var(--orange);color:var(--text);}

/* ══ CONTENT ════════════════════════════════════════ */
.content{padding:1.2rem;max-width:1050px;margin:0 auto;width:100%;flex:1;}

/* ══ CARD ════════════════════════════════════════════ */
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:1.05rem;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;
  margin-bottom:.8rem;color:var(--orange);}

/* ══ BADGE ═══════════════════════════════════════════ */
.badge{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:700;}
.b-green {background:rgba(34,197,94,.15);color:var(--success);}
.b-yellow{background:rgba(234,179,8,.15);color:var(--warn);}
.b-orange{background:rgba(249,115,22,.15);color:var(--orange);}
.b-red   {background:rgba(239,68,68,.15);color:var(--danger);}

/* ══ BUTTONS ════════════════════════════════════════ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.26rem;
  padding:.46rem .92rem;border-radius:8px;font-size:.8rem;font-weight:600;cursor:pointer;
  border:none;transition:all .15s;-webkit-appearance:none;touch-action:manipulation;}
.btn-p{background:var(--orange);color:#fff;}
.btn-p:hover,.btn-p:active{background:var(--orange2);}
.btn-g{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-g:hover,.btn-g:active{border-color:var(--orange);color:var(--orange);}
.btn-d{background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.3);}
.btn-s{background:rgba(34,197,94,.15);color:var(--success);border:1px solid rgba(34,197,94,.3);}
.btn-wa{background:var(--wa);color:#fff;border:none;}
.btn-wa:hover,.btn-wa:active{background:var(--wa2);}
.btn-sm{padding:.22rem .52rem;font-size:.7rem;}
.btn-full{width:100%;margin-top:.26rem;}
.btn:disabled{opacity:.38;cursor:not-allowed;pointer-events:none;}

/* ══ FORMS ═══════════════════════════════════════════ */
.fg{margin-bottom:.8rem;}
.fl{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:.26rem;line-height:1.2;}
.fi{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);
  padding:.52rem .76rem;border-radius:8px;font-size:.88rem;transition:border .15s;
  outline:none;-webkit-appearance:none;}
.fi:focus{border-color:var(--orange);}
.fi[readonly]{opacity:.6;cursor:not-allowed;}
textarea.fi{resize:vertical;min-height:82px;line-height:1.5;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;}
@media(max-width:480px){.fr{grid-template-columns:1fr;}}
select.fi option{background:var(--bg2);}

/* ══ SERVICE GRID ════════════════════════════════════ */
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:.8rem;}
.sc{border:2px solid var(--border);border-radius:10px;padding:1.2rem;cursor:pointer;
  transition:all .15s;text-align:center;touch-action:manipulation;
  min-height:160px;display:flex;flex-direction:column;justify-content:center;}
.sc:hover,.sc:active,.sc.sel{border-color:var(--orange);background:rgba(249,115,22,.07);}
.sc-name{font-weight:600;font-size:.88rem;margin-bottom:.25rem;line-height:1.3;}
.sc-price{color:var(--orange);font-size:.82rem;font-weight:700;margin:.35rem 0 .15rem;}
.sc-meta{color:var(--muted);font-size:.75rem;}

/* ══ TIME GRID ═══════════════════════════════════════ */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:.36rem;}
.tb{border:1px solid var(--border);background:var(--bg3);color:var(--text);padding:.38rem;
  border-radius:8px;cursor:pointer;font-size:.77rem;transition:all .15s;text-align:center;
  touch-action:manipulation;}
.tb:hover,.tb:active,.tb.sel{border-color:var(--orange);color:var(--orange);
  background:rgba(249,115,22,.07);}
.tb.taken{opacity:.45;background:rgba(239,68,68,.08);color:var(--danger);
  cursor:not-allowed;text-decoration:line-through;border-color:var(--danger);}

/* ══ STEP INDICATOR ══════════════════════════════════ */
.step-indicator{display:flex;gap:1rem;margin-bottom:1.5rem;justify-content:center;}
.step-dot{display:flex;align-items:center;justify-content:center;width:32px;height:32px;
  border-radius:50%;background:var(--bg3);border:2px solid var(--border);
  color:var(--muted);font-size:.8rem;font-weight:600;transition:all .2s;}
.step-dot.active{background:var(--orange);border-color:var(--orange);color:#fff;}
.step-dot.completed{background:var(--success);border-color:var(--success);}

/* ══ LIBRETITO ════════════════════════════════════════ */
.libretito-card{background:var(--bg3);border:1px solid rgba(249,115,22,.25);border-radius:14px;
  padding:1.2rem 1.2rem 1rem;margin-bottom:1.2rem;overflow:hidden;}
.libretito-header{display:flex;align-items:flex-start;justify-content:space-between;
  flex-wrap:wrap;gap:.5rem;margin-bottom:.9rem;padding-bottom:.8rem;
  border-bottom:1px solid var(--border);}
.libretito-service{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:1px;
  color:var(--text);line-height:1.15;}
.libretito-date{color:var(--muted);font-size:.82rem;margin-top:.18rem;}

.libretito-pills{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.85rem;}
.libretito-pill{display:inline-flex;flex-direction:column;background:var(--bg2);
  border:1px solid var(--border);border-radius:10px;padding:.5rem .8rem;min-width:110px;flex:1;}
.libretito-pill-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:.18rem;}
.libretito-pill-value{font-size:1.05rem;font-weight:700;color:var(--text);line-height:1.2;}
.libretito-pill.pill-km .libretito-pill-value{color:var(--orange);}
.libretito-pill.pill-oil .libretito-pill-value{color:#60a5fa;}
.libretito-pill.pill-next{grid-column:span 2;min-width:unset;
  background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(34,197,94,.04));
  border:1.5px solid var(--success);padding:.65rem 1rem;}
.libretito-pill.pill-next .libretito-pill-value{font-size:1.15rem;}

.libretito-cl-title{font-size:.72rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:.5rem;font-weight:600;}
.libretito-cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.36rem;margin-bottom:.8rem;}
.libretito-cl-item{display:flex;align-items:center;gap:.38rem;font-size:.84rem;
  font-weight:600;padding:.36rem .58rem;border-radius:7px;}
.libretito-cl-done{background:rgba(34,197,94,.1);color:var(--success);}
.libretito-cl-skip{background:rgba(239,68,68,.08);color:var(--danger);}
.libretito-cl-ico{font-size:.9rem;flex-shrink:0;}

.libretito-obs{background:var(--bg2);border:1px solid var(--border);border-radius:9px;
  padding:.75rem .9rem;font-size:.9rem;color:var(--text);line-height:1.65;margin-top:.1rem;}
.libretito-obs-label{font-size:.65rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-bottom:.32rem;font-weight:600;}

/* ══ MISC ════════════════════════════════════════════ */
.sh{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:.9rem;flex-wrap:wrap;gap:.46rem;}
.st{font-family:'Bebas Neue',sans-serif;font-size:1.38rem;letter-spacing:1px;}
.sn{display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px;
  border-radius:50%;background:var(--orange);color:#fff;font-family:'Bebas Neue',sans-serif;
  font-size:.88rem;margin-right:.38rem;flex-shrink:0;}
.divider{border:none;border-top:1px solid var(--border);margin:1rem 0;}
.alert{padding:.74rem .9rem;border-radius:8px;margin-bottom:.8rem;font-size:.8rem;line-height:1.5;}
.ao{background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.3);color:var(--orange);}
.ag{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--success);}
.ar{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);}
.ab{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);color:var(--blue);}
.vtype-btns{display:flex;gap:.5rem;margin-top:.26rem;}
.vtype-btn{flex:1;padding:.5rem;border:2px solid var(--border);border-radius:8px;
  background:transparent;color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;
  transition:all .15s;text-align:center;touch-action:manipulation;}
.vtype-btn.sel{border-color:var(--orange);background:rgba(249,115,22,.08);color:var(--orange);}
.pit-badge{display:inline-block;padding:.11rem .4rem;border-radius:6px;font-size:.65rem;font-weight:700;margin-left:.3rem;}
.pit-auto  {background:rgba(59,130,246,.15);color:var(--blue);}
.pit-camion{background:rgba(168,85,247,.15);color:#c084fc;}
.closed-msg{text-align:center;padding:1.4rem;color:var(--danger);font-size:.88rem;
  background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:10px;}
.empty{text-align:center;padding:2rem 1rem;color:var(--muted);}
.sum-box{background:rgba(249,115,22,.05);border:1px solid rgba(249,115,22,.3);
  border-radius:12px;padding:.92rem;margin-bottom:.85rem;}
.appt-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:.88rem;display:flex;justify-content:space-between;align-items:center;
  flex-wrap:wrap;gap:.52rem;margin-bottom:.52rem;}
.next-svc{background:linear-gradient(135deg,rgba(249,115,22,.12),rgba(249,115,22,.04));
  border:1px solid rgba(249,115,22,.35);border-radius:14px;padding:1rem 1.1rem;
  margin-bottom:1.3rem;}
.next-svc-title{font-family:'Bebas Neue',sans-serif;font-size:1.02rem;letter-spacing:1px;
  color:var(--orange);margin-bottom:.36rem;}
.success-banner{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.38);
  border-radius:14px;padding:1.28rem;margin-bottom:.88rem;text-align:center;}
.sb-icon{font-size:2.2rem;margin-bottom:.36rem;}
.sb-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,5vw,2.2rem);
  letter-spacing:2px;color:var(--success);margin-bottom:.4rem;text-transform:uppercase;}
.sb-sub{color:var(--muted);font-size:.8rem;margin-bottom:.88rem;line-height:1.55;}
.btn-wa-big{background:linear-gradient(135deg,var(--wa),#0dd94c);color:#fff;border:none;
  border-radius:10px;padding:.8rem 1.5rem;font-size:1.05rem;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:.46rem;transition:all .15s;
  touch-action:manipulation;width:100%;justify-content:center;letter-spacing:.5px;
  text-transform:uppercase;box-shadow:0 4px 16px rgba(37,211,102,.25);}
.btn-wa-big:active{box-shadow:0 2px 8px rgba(37,211,102,.2);transform:scale(.98);}
.btn-wa-big-hint{color:var(--muted);font-size:.7rem;margin-top:.42rem;}

/* ══ LOADER ══════════════════════════════════════════ */
@keyframes spin{to{transform:rotate(360deg);}}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(249,115,22,.25);
  border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;}
.loader-full{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1rem;}
.big-spin{width:38px;height:38px;border:3px solid rgba(249,115,22,.2);
  border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;}
</style>
</head>
<body>

<div id="toastBox"></div>
<div class="loader-full" id="appLoader">
  <div class="big-spin"></div>
  <div style="color:var(--muted);font-size:.86rem">Conectando con Firebase...</div>
</div>

<!-- ═══════════ LANDING ═══════════ -->
<div class="page" id="pgLanding">
  <div class="logo">LUBRICENTRO <span>ESQUIÚ</span></div>
  <div class="land-sub">Turnos Online · Córdoba</div>
  <div class="land-cards">
    <div class="lcard" onclick="renderClientLogin()">

    📍 Ver en Google Maps</a><br/>
  <button class="btn btn-wa" style="padding:.62rem 1.3rem;font-size:.9rem;margin-top:.4rem"
    onclick="window.open('https://wa.me/5493513880155','_blank')">💬 Consultas por WhatsApp</button>
</div>

<!-- ═══════════ CLIENT APP ═══════════ -->
<div class="page" id="pgClient">
  <div class="topbar">
    <div class="tbrand">LUBRICENTRO <span>ESQUIÚ</span></div>
    <div class="topbar-r">
      <span id="clientNameLbl" style="color:var(--muted);font-size:.78rem;display:none"></span>
      <button class="back-btn" onclick="go('pgLanding')">← Inicio</button>
    </div>

<!-- ═══════════ REGISTRO ═══════════ -->
<div class="page" id="pgRegister">
  <div class="topbar">
    <div class="tbrand">LUBRICENTRO <span>ESQUIÚ</span></div>
    <div class="topbar-r">
      <button class="back-btn" onclick="go('pgLanding')">← Volver</button>
    </div>
  </div>
  <div class="content">
    <div style="max-width:450px;margin:0 auto">
      <div class="card">
        <h2 style="font-family:'Bebas Neue';font-size:1.5rem;letter-spacing:1px;margin-bottom:1.5rem">REGISTRAR CLIENTE</h2>
        <div id="rErr" class="alert ar" style="display:none;margin-bottom:1rem"></div>
        
        <div class="fg">
          <label class="fl">Nombre *</label>
          <input class="fi" id="rName" placeholder="Tu nombre completo"/>
        </div>
        
        <div class="fg">
          <label class="fl">WhatsApp *</label>
          <input class="fi" id="rWa" placeholder="351 XXXXXXXX" type="tel"/>

            <option value="Ford">Ford</option>
            <option value="Chevrolet">Chevrolet</option>
            <option value="Volkswagen">Volkswagen</option>
            <option value="Renault">Renault</option>

            <option value="Honda">Honda</option>

          <input class="fi" id="rBrandOther" placeholder="Marca del vehículo"/>
        </div>
        
        <div class="fg">
          <label class="fl">Modelo *</label>
          <input class="fi" id="rModel" placeholder="EJ: 208"/>
        </div>
        
        <div class="fg">
          <label class="fl">Año *</label>
          <input class="fi" id="rYear" placeholder="2020" type="number" min="1990" max="2030"/>
        </div>
        
        <div class="fg">
          <label class="fl">Motor (cc) *</label>
          <input class="fi" id="rMotor" placeholder="1600" type="number"/>
        </div>
        
        <button class="btn btn-p btn-full" onclick="doRegister()" style="margin-top:1rem">Registrarse →</button>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════
     JAVASCRIPT

<script>
/* ══ FIREBASE INIT ══════════════════════════════════ */

async function fsGet(key, fallback = []) {
  try {
    const doc = await db.collection("lubricentro").doc(key).get();
    if (!doc.exists) {
      console.warn(`Doc not found: ${key}, using fallback`);
      return fallback;
    }
    return doc.data().data || fallback;
  } catch (e) {
    console.error(`fsGet error [${key}]:`, e.message);
    return fallback;
  }
}

async function fsPut(key, val) {
  try {
    await db.collection("lubricentro").doc(key).set({ data: val });
    console.log(`Saved: ${key}`);
  } catch (e) {
    console.error(`fsPut error [${key}]:`, e.message);
    toast("Error al guardar. Revisá tu conexión.", "error");
  }
}

/* ══ SERVICE INTERVALS ══════════════════════════════ */
function calcNextService(km, dateStr, vtype) {
  const iv = SVC_INTERVAL[vtype] || SVC_INTERVAL.auto;
  const nextKm = (parseInt(km) || 0) + iv.km;
  const dt = new Date((dateStr || todayISO) + "T12:00:00");
  dt.setMonth(dt.getMonth() + iv.months);
  return { nextKm, nextDate: dt.toISOString().split("T")[0], iv };
}

function calcNextKm(val) {
  const apptId = document.getElementById("mCompId")?.value;
  const appt = APPTS.find(a => a.id === apptId);
  const vtype = appt ? CLIENTS.find(c => c.id === appt.clientId)?.vehicleType || "auto" : "auto";
  const iv = SVC_INTERVAL[vtype] || SVC_INTERVAL.auto;
  const n = parseInt(val);
  const kmEl = document.getElementById("mCompNextKm");
  const dtEl = document.getElementById("mCompNextDate");
  const wrap = document.getElementById("mCompNextDateWrap");
  if (!isNaN(n)) {
    if (kmEl) kmEl.value = n + iv.km;
    const nd = new Date(todayISO + "T12:00:00");
    nd.setMonth(nd.getMonth() + iv.months);
    if (dtEl) dtEl.value = fmtD(nd.toISOString().split("T")[0]);
    if (wrap) wrap.style.display = "block";
  } else {
    if (kmEl) kmEl.value = "";
    if (dtEl) dtEl.value = "";
    if (wrap) wrap.style.display = "none";
  }
}

/* ══ HOURS / DATE LOGIC ═════════════════════════════ */
function getHoursForDate(dateStr) {
  const dow = new Date(dateStr + "T12:00:00").getDay();
  if (dow === 0) return [];
  if (dow === 6) return [...HRS_MORNING];
  return [...HRS_MORNING, ...HRS_AFTERNOON];
}

function isDayClosed(dateStr) {
  return new Date(dateStr + "T12:00:00").getDay() === 0;
}

/* ══ SLOT / PIT LOGIC ═══════════════════════════════ */
function getPit(svcId) {
  return (SERVICES.find(s => s.id === svcId)?.type || "auto") === "camion" ? "camion" : "auto";
}

function getTaken(date, pit, excludeId = null) {
  const s = new Set();
  APPTS.filter(a => a.date === date && a.id !== excludeId && (a.pit || "auto") === pit)
    .forEach(a => (a.blockedSlots || [a.time]).forEach(t => s.add(t)));
  return s;
}

function getSlots(startTime, durMins, dateStr) {
  const n = Math.max(1, Math.ceil((durMins || 30) / 30));
  const dayH = getHoursForDate(dateStr);
  const idx = dayH.indexOf(startTime);
  if (idx === -1 || idx + n > dayH.length) return null;
  const slots = [];
  for (let i = 0; i < n; i++) {
    if (i > 0) {
      const [ph, pm] = dayH[idx + i - 1].split(":").map(Number);
      const [ch, cm] = dayH[idx + i].split(":").map(Number);
      if ((ch * 60 + cm) - (ph * 60 + pm) !== 30) return null;
    }
    slots.push(dayH[idx + i]);
  }
  return slots;
}

function isAvail(time, durMins, takenSet, dateStr) {
  const slots = getSlots(time, durMins, dateStr);
  return slots !== null && !slots.some(s => takenSet.has(s));
}

  document.getElementById("clientArea").innerHTML = `
    <div class="sh"><div class="st">📖 MI LIBRETITO</div></div>
    <div class="alert ab" style="margin-bottom:.9rem;font-size:.78rem">ℹ️ Tu vehículo necesita service cada <strong>${iv.months} meses</strong> o <strong>${fmtNum(iv.km)} km</strong>.</div>
    ${done.length === 0 ? '<div class="empty">📖 Aún no hay services completados.</div>' : done.map(a => buildLibretitoCard(a)).join("")}`;
}

function buildLibretitoCard(a) {
  const cl2 = a.checklist || {};
  const doneItems = CHECKLIST.filter(c => cl2[c.id] === "done");
  const skipItems = CHECKLIST.filter(c => cl2[c.id] === "skip");
  return `
    <div class="libretito-card">
      <div class="libretito-header">
        <div><div class="libretito-service">🔧 ${esc(a.serviceName)}</div>
        <div class="libretito-date">📅 ${fmtD(a.date)} a las ${a.time}</div></div>${bdg(a.status)}</div>
      <div class="libretito-pills">
        ${a.km ? `<div class="libretito-pill pill-km"><span class="libretito-pill-label">📏 KM</span><span class="libretito-pill-value">${fmtNum(a.km)} km</span></div>` : ""}
        ${a.oilBrand ? `<div class="libretito-pill pill-oil"><span class="libretito-pill-label">🛢 ACEITE</span><span class="libretito-pill-value">${esc(a.oilBrand)}</span></div>` : ""}
        ${a.nextKm ? `<div class="libretito-pill pill-next"><span class="libretito-pill-label">🎯 PRÓXIMO</span><span class="libretito-pill-value">${fmtNum(a.nextKm)} km</span></div>` : ""}
      </div>
      ${(doneItems.length || skipItems.length) ? `<div class="libretito-cl-title">ÍTEMS DEL SERVICE</div>
      <div class="libretito-cl-grid">
        ${doneItems.map(c => `<div class="libretito-cl-item libretito-cl-done"><span class="libretito-cl-ico">✔</span>${esc(c.label)}</div>`).join("")}
        ${skipItems.map(c => `<div class="libretito-cl-item libretito-cl-skip"><span class="libretito-cl-ico">✖</span>${esc(c.label)}</div>`).join("")}
      </div>` : ""}
      ${a.notes ? `<div class="libretito-obs-label">💬 OBSERVACIONES</div><div class="libretito-obs">${esc(a.notes)}</div>` : ""}
    </div>`;
}

/* ══ BOOKING FLOW ════════════════════════════════════ */
function renderBooking() {
  BK = { step: 1, service: null, date: todayISO, time: "", km: "" };
  while (isDayClosed(BK.date)) {
    const d = new Date(BK.date + "T12:00:00");
    d.setDate(d.getDate() + 1);
    BK.date = d.toISOString().split("T")[0];
  }
  drawBooking();
}

function drawBooking() {
  const myServices = SERVICES.filter(s => (s.type || "auto") === (ME.vehicleType || "auto"));
  const selSvc = BK.service ? SERVICES.find(s => s.id === BK.service) : null;
  const dur = selSvc?.duration || 30;
  const pit = BK.service ? getPit(BK.service) : ME.vehicleType === "camion" ? "camion" : "auto";
  const dayH = getHoursForDate(BK.date);
  const taken = getTaken(BK.date, pit);
  const isClosed = dayH.length === 0;

  document.getElementById("clientArea").innerHTML = `
    <div style="max-width:540px">
      <div style="display:flex;align-items:center;gap:.55rem;margin-bottom:1.5rem">
        <button class="back-btn" onclick="renderClientHome()">← Volver</button>
        <h2 style="font-family:'Bebas Neue';font-size:1.52rem;letter-spacing:1px">SACAR TURNO</h2>
      </div>
      <div class="step-indicator">
        <div class="step-dot ${BK.step >= 1 ? "active" : ""}${BK.step > 1 ? "completed" : ""}">1</div>
        <div class="step-dot ${BK.step >= 2 ? "active" : ""}${BK.step > 2 ? "completed" : ""}">2</div>
        <div class="step-dot ${BK.step >= 3 ? "active" : ""}${BK.step > 3 ? "completed" : ""}">3</div>
      </div>
      <div class="card" style="margin-bottom:.8rem">
        <div class="stitle"><span class="sn">1</span> Elegí el servicio</div>
        <div class="sg">${myServices.map(s => `<div class="sc${BK.service === s.id ? " sel" : ""}" onclick="bkSvc('${s.id}')">
          <div class="sc-name">${esc(s.name)}</div><div class="sc-price">${s.price}</div><div class="sc-meta">${s.duration} min</div></div>`).join("")}</div>
      </div>
      ${BK.step >= 2 ? `<div class="card" style="margin-bottom:.8rem">
        <div class="stitle"><span class="sn">2</span> Elegí el día y horario</div>
        <div class="fg"><label class="fl">Fecha</label>
          <input type="date" class="fi" value="${BK.date}" min="${todayISO}" onchange="bkDate(this.value)"/></div>
        ${isClosed ? '<div class="closed-msg">🚫 El lubricentro está cerrado los domingos.</div>' : `<div class="fg">
          <label class="fl">Horario disponible</label>
          <div class="tg">${dayH.map(h => { const ok = isAvail(h, dur, taken, BK.date);
            return `<button class="tb${BK.time === h ? " sel" : ""}${!ok ? " taken" : ""}" ${!ok ? "disabled" : ""} onclick="bkTime('${h}')">${h}</button>`;
          }).join("")}</div></div>`}
      </div>` : ""}
      ${BK.step >= 3 ? `<div class="card" style="margin-bottom:.8rem">
        <div class="stitle"><span class="sn">3</span> Confirmá tu vehículo</div>
        <div style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:.5rem .76rem;font-size:.82rem;margin-bottom:.76rem">
          ${ME.vehicleType === "camion" ? "🚛" : "🚗"} <strong>${esc(ME.brand)} ${esc(ME.model)} ${ME.year}</strong> — ${ME.patent}</div>
        <div class="fg"><label class="fl">Kilómetros actuales (opcional)</label>
          <input class="fi" id="bkKm" value="${BK.km}" type="number" oninput="BK.km=this.value" placeholder="85000"/></div>
      </div>` : ""}
      ${BK.step >= 3 && BK.service && BK.time && !isClosed ? `<div class="sum-box">
        <div style="font-family:'Bebas Neue';font-size:.98rem;letter-spacing:1px;margin-bottom:.62rem;color:var(--orange)">RESUMEN</div>
        <div style="display:grid;gap:.28rem;font-size:.82rem">
          <div>🔧 <strong>${esc(selSvc?.name)}</strong></div>
          <div>📅 <strong>${fmtD(BK.date)}</strong> a las <strong>${BK.time}</strong></div>
          <div>${ME.vehicleType === "camion" ? "🚛" : "🚗"} <strong>${esc(ME.brand)} ${esc(ME.model)} ${ME.year}</strong> — ${ME.patent}</div>
          ${BK.km ? `<div>📏 ${fmtNum(BK.km)} km</div>` : ""}
        </div>
        <button class="btn btn-p btn-full" style="margin-top:.8rem" onclick="confirmBk()">✅ Confirmar y Guardar Turno</button>
      </div>` : ""}
    </div>`;
}

function bkSvc(id) { BK.service = id; BK.time = ""; if (BK.step < 2) BK.step = 2; drawBooking(); }
function bkTime(h) { BK.time = h; if (BK.step < 3) BK.step = 3; drawBooking(); }
function bkDate(d) {
  if (isDayClosed(d)) {
    toast("Domingos cerrado. Avanzando al lunes.", "warn");
    const nd = new Date(d + "T12:00:00");
    nd.setDate(nd.getDate() + 1);
    BK.date = nd.toISOString().split("T")[0];
  } else {
    BK.date = d;
  }
  BK.time = "";
  drawBooking();
}

async function confirmBk() {
  const sv = SERVICES.find(s => s.id === BK.service);
  if (!sv) return;
  if (isDayClosed(BK.date)) { toast("Cerrado ese día", "error"); return; }
  const dur = sv.duration || 30;
  const pit = getPit(BK.service);
  const freshAppts = await fsGet("appointments", []);
  APPTS = freshAppts;
  const taken = getTaken(BK.date, pit);
  if (!isAvail(BK.time, dur, taken, BK.date)) {
    toast("Ese horario ya fue tomado.", "error");
    BK.time = "";
    drawBooking();
    return;
  }
  const slots = getSlots(BK.time, dur, BK.date) || [BK.time];
  const appt = {
    id: uid(), clientId: ME.id, patent: ME.patent,
    vehicleDesc: `${ME.brand} ${ME.model} ${ME.year}`,
    motor: ME.motor || "", date: BK.date, time: BK.time,
    service: BK.service, serviceName: sv.name,
    pit, blockedSlots: slots, status: "pendiente", km: BK.km, notes: ""
  };
  APPTS.push(appt);
  await fsPut("appointments", APPTS);
  const waMsg = `¡Hola! Reservé un turno en Lubricentro Esquiú.\n\n🔧 *Servicio:* ${sv.name}\n📅 *Fecha:* ${fmtD(BK.date)} a las ${BK.time}\n${ME.vehicleType === "camion" ? "🚛" : "🚗"} *Vehículo:* ${ME.brand} ${ME.model} ${ME.year}\n🔑 *Patente:* ${ME.patent}\n⚙️ *Motor:* ${ME.motor || "—"}\n🔩 *Fosa:* ${pit === "camion" ? "Camiones" : "Autos"}`;
  const waURL = `https://wa.me/${PHONE_LUBRI}?text=${encodeURIComponent(waMsg)}`;
  document.getElementById("clientArea").innerHTML = `
    <div style="max-width:480px;padding-top:1.5rem">
      <div class="success-banner">
        <div class="sb-icon">🎉</div>
        <div class="sb-title">¡TURNO GUARDADO!</div>
        <div class="sb-sub"><strong>${esc(sv.name)}</strong><br/>📅 ${fmtD(BK.date)} a las ${BK.time}<br/>${ME.vehicleType === "camion" ? "🚛" : "🚗"} ${esc(ME.brand)} ${esc(ME.model)} — ${ME.patent}</div>
        <button class="btn-wa-big" onclick="window.open('${waURL}','_blank')">📲 CONFIRMAR POR WHATSAPP</button>
        <div class="btn-wa-big-hint">Tocá para notificar al lubricentro.</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:.45rem;margin-top:.15rem">
        <button class="btn btn-g btn-full" onclick="renderMyAppts()">📋 Ver mis turnos</button>
        <button class="btn btn-g btn-full" onclick="renderClientHome()">← Inicio</button>
      </div>
    </div>`;
}

/* ══ INIT ════════════════════════════════════════════ */
(async () => {
  try {
    console.log("Iniciando carga de datos...");
    const [clients, appts, services] = await Promise.all([
      fsGet("clients", []),
      fsGet("appointments", []),
      fsGet("services", DEFAULT_SVC),
    ]);
    CLIENTS = clients || [];
    APPTS = appts || [];
    SERVICES = services && services.length > 0 ? services : DEFAULT_SVC;
    if (!SERVICES.length) {
      SERVICES = DEFAULT_SVC;
      await fsPut("services", SERVICES);
    }
    console.log("Datos cargados. Clientes:", CLIENTS.length, "Turnos:", APPTS.length, "Servicios:", SERVICES.length);
  } catch (e) {
    console.error("Error durante init:", e);
    SERVICES = DEFAULT_SVC;
    toast("Error al conectar. Usando datos locales.", "error", 5000);
  }
  document.getElementById("appLoader").style.display = "none";
  go("pgLanding");
})();
</script>
</body>
</html>
